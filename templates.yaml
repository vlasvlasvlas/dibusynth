# dibusynth — templates de síntesis
# Podés agregar los tuyos propios.
# Parámetros: waveform (sine/triangle/square/sawtooth),
#   octave (-2..2), detune (cents), filterType (none/lowpass/highpass/bandpass),
#   filterFreq (Hz), filterQ (0.1..20), release (ms), gain (0..1)

templates:

  # ── Originales dibusynth (no borrar) ────────────────────────────────────────

  orig_verde:
    label: "verde original"
    waveform: sine
    octave: 0
    detune: 0
    filterType: lowpass
    filterFreq: 3500
    filterQ: 1
    release: 600
    gain: 0.75

