<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>dibusynth</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <canvas id="canvas"></canvas>

    <div id="panel">
      <div class="panel-row" id="row-transport">
        <button id="btn-play" aria-label="play">▶</button>
        <button id="btn-pencil" class="tool-btn active" aria-label="pencil">✏</button>
        <button id="btn-line-solid" class="tool-btn" aria-label="solid line">—</button>
        <button id="btn-line-dashed" class="tool-btn" aria-label="dashed line">╌</button>
        <button id="btn-circle" class="tool-btn" aria-label="circle">○</button>
        <button id="btn-eraser" class="tool-btn" aria-label="eraser">◻</button>
        <button id="btn-undo" aria-label="undo">↩</button>
        <button id="btn-clear" aria-label="clear">✕</button>
        <div class="bpm-control">
          <button id="btn-bpm-down" aria-label="bpm down">−</button>
          <span id="bpm-value">90</span>
          <button id="btn-bpm-up" aria-label="bpm up">+</button>
        </div>
        <div class="vol-control">
          <label for="slider-master-vol">vol</label>
          <input type="range" id="slider-master-vol" min="0" max="1" step="0.01" value="0.7">
        </div>
      </div>

      <div class="panel-row" id="row-colors">
        <!-- populated by ui.js -->
      </div>

      <div class="panel-row" id="row-sweeps">
        <!-- sweep items prepended by ui.js -->
        <div class="sep"></div>
        <select id="select-key" aria-label="key"></select>
        <select id="select-scale" aria-label="scale"></select>
        <div class="sep"></div>
        <label class="quantize-label" title="Quantize to grid">
          <input type="checkbox" id="chk-quantize" aria-label="quantize">
          <span>grid</span>
        </label>
        <input type="range" id="slider-cell-size" min="10" max="80" step="5" value="25" title="Grid cell size" aria-label="cell size">
        <div class="sep"></div>
        <label class="grad-label" title="Background color 1">
          <input type="color" id="color-bg1" value="#f0ebe0" aria-label="background color 1">
        </label>
        <label class="grad-label" title="Background color 2">
          <input type="color" id="color-bg2" value="#ffffff" aria-label="background color 2">
        </label>
        <button id="btn-grad-dir" title="Gradient direction" aria-label="gradient direction">↕</button>
      </div>
    </div>
  </div>

  <!-- Timbre config popover -->
  <div id="timbre-popover" class="hidden" role="dialog" aria-label="timbre config">
    <div class="tp-header">
      <div id="tp-swatch"></div>
      <select id="tp-template" aria-label="template de síntesis">
        <option value="">— síntesis —</option>
      </select>
      <button id="timbre-close" aria-label="close">✕</button>
    </div>

    <!-- Onda + Octava -->
    <div class="tp-row">
      <span class="tp-lbl">onda</span>
      <div class="tp-btngroup" id="wave-group">
        <button class="wave-btn active" data-wave="sine">∿ sine</button>
        <button class="wave-btn" data-wave="triangle">△ tri</button>
        <button class="wave-btn" data-wave="square">⊓ sq</button>
        <button class="wave-btn" data-wave="sawtooth">⊿ saw</button>
      </div>
      <span class="tp-lbl">oct</span>
      <div class="tp-btngroup" id="oct-group">
        <button class="oct-btn" data-oct="-2">-2</button>
        <button class="oct-btn" data-oct="-1">-1</button>
        <button class="oct-btn active" data-oct="0">0</button>
        <button class="oct-btn" data-oct="1">+1</button>
        <button class="oct-btn" data-oct="2">+2</button>
      </div>
    </div>

    <!-- Filtro -->
    <div class="tp-row">
      <span class="tp-lbl">filtro</span>
      <div class="tp-btngroup" id="filt-group">
        <button class="filt-btn" data-filt="none">off</button>
        <button class="filt-btn active" data-filt="lowpass">lpf</button>
        <button class="filt-btn" data-filt="highpass">hpf</button>
        <button class="filt-btn" data-filt="bandpass">bpf</button>
      </div>
      <span class="tp-lbl">cut</span>
      <input type="range" id="t-cutoff" min="50" max="18000" step="50" value="1200">
      <span class="tp-lbl">res</span>
      <input type="range" id="t-q" min="0.1" max="20" step="0.1" value="2">
    </div>

    <!-- Release / Detune / Vol -->
    <div class="tp-row">
      <span class="tp-lbl">rel</span>
      <input type="range" id="t-release" min="20" max="2000" step="10" value="300">
      <span class="tp-lbl">det</span>
      <input type="range" id="t-detune" min="-50" max="50" step="1" value="0">
      <span class="tp-lbl">vol</span>
      <input type="range" id="t-gain" min="0" max="1" step="0.01" value="0.8">
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
  <script src="canvas.js"></script>
  <script src="audio.js"></script>
  <script src="scanner.js"></script>
  <script src="ui.js"></script>
</body>
</html>
